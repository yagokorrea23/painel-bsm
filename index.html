function delta(cur,prev,invert){
  if(cur==null||prev==null||prev===0) return '<span class="d flat">sem base de comparação</span>';
  var d=((cur-prev)/prev)*100, flat=Math.abs(d)<0.05, good=invert?d<0:d>0;
  var cls=flat?"flat":(good?"up":"down"), ar=flat?"–":(d>0?"▲":"▼");
  return '<span class="d '+cls+'">'+ar+" "+nf(Math.abs(d),1)+'%<span class="m"> vs. período anterior</span></span>';
}
function kpi(label,value,f,prev,invert,hero,nota){
  return '<div class="k'+(hero?" hero":"")+'"><div class="kl">'+label+'</div><div class="kv">'+fmt(value,f)+'</div>'+
    (nota?'<span class="d flat">'+nota+'</span>':delta(value,prev==null?null:prev,invert))+'</div>';
}
function chart(serie){
  if(!serie||!serie.length) return "";
  var W=1000,H=220,PADL=8,PADR=8,PADT=16,PADB=26,n=serie.length;
  var maxS=1,maxR=1,i;
  for(i=0;i<n;i++){if(serie[i][1]>maxS)maxS=serie[i][1];if(serie[i][2]>maxR)maxR=serie[i][2];}
  var bw=(W-PADL-PADR)/n;
  function x(i){return PADL+i*bw;}
  function yS(v){return PADT+(H-PADT-PADB)*(1-v/maxS);}
  function yR(v){return PADT+(H-PADT-PADB)*(1-v/maxR);}
  var bars="",pts="",path="",step=Math.ceil(n/7),labels="";
  for(i=0;i<n;i++){
    var h=Math.max(H-PADB-yS(serie[i][1]),0);
    bars+='<rect x="'+(x(i)+bw*0.18)+'" y="'+yS(serie[i][1])+'" width="'+(bw*0.64)+'" height="'+h+'" rx="2" fill="rgba(201,162,39,0.30)"/>';
    path+=(i===0?"M ":"L ")+(x(i)+bw/2)+" "+yR(serie[i][2])+" ";
    pts+='<circle cx="'+(x(i)+bw/2)+'" cy="'+yR(serie[i][2])+'" r="2.2" fill="#5FA8FF"/>';
    if(i%step===0){var p=serie[i][0].split("/");labels+='<text x="'+(x(i)+bw/2)+'" y="'+(H-8)+'" fill="#7F93AE" font-size="11" text-anchor="middle">'+p[1]+"/"+p[0]+'</text>';}
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+bars+
    '<path d="'+path+'" fill="none" stroke="#5FA8FF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    pts+'<line x1="0" x2="'+W+'" y1="'+(H-PADB)+'" y2="'+(H-PADB)+'" stroke="rgba(255,255,255,0.07)"/>'+labels+'</svg>';
}
function tabela(rows){
  if(!rows||!rows.length) return '<div style="color:#7F93AE;padding:28px 4px;font-size:14px">Nenhuma campanha com veiculação no período selecionado.</div>';
  var h='<div class="wrap"><table><thead><tr><th class="l">Campanha</th><th>Investimento</th><th>Resultados</th><th>Custo/result.</th><th>Impressões</th><th>Alcance</th><th>CPM</th><th>CTR</th><th>CPC</th></tr></thead><tbody>';
  for(var i=0;i<rows.length;i++){
    var c=rows[i],t=totais([c]);
    h+='<tr><td class="l"><div class="cn"><span class="dot'+(c[1]?" on":"")+'"></span><span><span>'+esc(c[0])+'</span><span class="cm">'+(c[1]?"Ativa":"Pausada")+" · "+esc(DATA.t[c[2]])+'</span></span></div></td>'+
       '<td>'+brl(t.investimento)+'</td><td style="font-weight:600">'+num(t.resultados)+'</td><td>'+brl(t.cpa)+'</td>'+
       '<td>'+num(t.impressoes)+'</td><td>'+num(t.alcance)+'</td><td>'+brl(t.cpm)+'</td><td>'+pct(t.ctr)+'</td><td>'+brl(t.cpc)+'</td></tr>';
  }
  return h+"</tbody></table></div>";
}
function backlog(){
  function bloco(titulo,itens,ok){
    var h='<div style="margin-bottom:34px"><div class="bg">'+titulo+' <span style="color:'+(ok?"#49C98A":GOLD)+'">('+itens.length+')</span></div>';
    for(var i=0;i<itens.length;i++){
      var ic=ok?"✓":'<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="'+GOLD+'" stroke-width="1.5"/><path d="M10.6 10.6L14 14" stroke="'+GOLD+'" stroke-width="1.5" stroke-linecap="round"/></svg>';
      h+='<div class="bi'+(ok?" ok":"")+'"><div class="bic">'+ic+'</div><div><div class="bit">'+esc(itens[i][1])+'</div><div class="bid">'+esc(itens[i][2])+'</div></div></div>';
    }
    return h+"</div>";
  }
  var f=DATA.b.filter(function(x){return x[0]===1;}),p=DATA.b.filter(function(x){return x[0]===0;});
  return '<div style="max-width:820px">'+bloco("Concluído",f,true)+bloco("Em aberto",p,false)+"</div>";
}

var ABA="multi", PER="mes";
var TABS=[["multi","Multipropriedade","Prioritária"],["trab","Trabalhista",null],["backlog","Backlog",null]];

function render(){
  var periodo=null,i;
  for(i=0;i<DATA.p.length;i++) if(DATA.p[i].i===PER) periodo=DATA.p[i];
  document.getElementById("sub").innerHTML="Meta Ads · conta "+DATA.m.conta+" · atualizado em "+DATA.m.atualizado;
  document.getElementById("rodape").innerHTML=esc(DATA.m.cliente)+" · OAB/RS 10.147";
  document.getElementById("perinfo").innerHTML=periodo.r+(periodo.c?" · comparando com "+periodo.c:"");
  document.getElementById("selbox").className=(ABA==="backlog"?"inv":"");

  var nav="";
  for(i=0;i<TABS.length;i++){
    nav+='<button class="'+(ABA===TABS[i][0]?"on":"")+'" data-t="'+TABS[i][0]+'">'+TABS[i][1]+(TABS[i][2]?'<span class="tag">'+TABS[i][2]+"</span>":"")+"</button>";
  }
  document.getElementById("nav").innerHTML=nav;
  var bts=document.getElementById("nav").getElementsByTagName("button");
  for(i=0;i<bts.length;i++) bts[i].onclick=function(){ABA=this.getAttribute("data-t");render();};

  var el=document.getElementById("conteudo");
  if(ABA==="backlog"){el.innerHTML=backlog();return;}

  var g=periodo.g[ABA], rows=g.a, t=totais(rows), a=g.b?totais(g.b):null;
  var h='<div class="grid1">'+
    kpi("Investimento",t.investimento,"brl0",a?a.investimento:null,false,true)+
    kpi("Resultados",t.resultados,"num",a?a.resultados:null,false,true)+
    kpi("Custo por resultado",t.cpa,"brl",a?a.cpa:null,true,true)+
    kpi("Campanhas no período",t.campanhas,"num",null,false,true,t.campanhas===1?"1 campanha com veiculação":t.campanhas+" campanhas com veiculação")+
    '</div><div class="grid2">'+
    kpi("Impressões",t.impressoes,"num",a?a.impressoes:null)+
    kpi("Alcance",t.alcance,"num",a?a.alcance:null)+
    kpi("CPM",t.cpm,"brl",a?a.cpm:null,true)+
    kpi("CTR",t.ctr,"pct",a?a.ctr:null)+
    kpi("CPC",t.cpc,"brl",a?a.cpc:null,true)+
    kpi("Frequência",t.freq,"dec",a?a.freq:null,true)+
    '</div>'+
    '<section class="card"><div class="chead"><div><div class="ct">Investimento e resultados por dia</div>'+
    '<div class="cs">Últimos 45 dias, independente do período selecionado acima</div></div>'+
    '<div class="leg"><span><span class="sw1"></span>Investimento</span><span><span class="sw2"></span>Resultados</span></div></div>'+
    chart(DATA.d[ABA])+'</section>'+
    '<div class="tt">Campanhas no período <span>· '+periodo.r+'</span></div>'+
    tabela(rows)+
    '<p class="nota">Resultados seguem a métrica de otimização de cada campanha: leads de formulário nativo, envios de formulário no site e conversas iniciadas no WhatsApp. O alcance é somado por campanha, então pode haver sobreposição de pessoas entre campanhas que rodaram ao mesmo tempo. Janela de atribuição padrão da conta: 1 dia de visualização e 7 dias de clique.</p>';
  el.innerHTML=h;
}

(function(){
  var s=document.getElementById("per"),o="";
  for(var i=0;i<DATA.p.length;i++) o+='<option value="'+DATA.p[i].i+'"'+(DATA.p[i].i===PER?" selected":"")+">"+DATA.p[i].l+"</option>";
  s.innerHTML=o;
  s.onchange=function(){PER=this.value;render();};
  render();
})();

</script>
